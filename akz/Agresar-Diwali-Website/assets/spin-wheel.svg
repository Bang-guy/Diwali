  <circle cx="400" cy="400" r="366" fill="none" stroke="#fff0c8" stroke-opacity=".62" stroke-width="3" stroke-dasharray="4 225" stroke-linecap="round"/>
  <g fill="#fff3dc" font-family="Georgia,serif" font-size="21" font-weight="bold" text-anchor="middle" filter="url(#shadow)">
    <text x="400" y="126"><tspan x="400">DUMB</tspan><tspan x="400" dy="25">CHARADES</tspan></text>
    <text x="553" y="177"><tspan x="553">REPEAT</tspan><tspan x="553" dy="25">AFTER ME</tspan></text>
    <text x="648" y="308"><tspan x="648">READ</tspan><tspan x="648" dy="25">MY LIPS</tspan></text>
    <text x="648" y="469"><tspan x="648">WRONG</tspan><tspan x="648" dy="25">ANSWERS</tspan><tspan x="648" dy="25">ONLY</tspan></text>
    <text x="553" y="602"><tspan x="553">EMOTION</tspan><tspan x="553" dy="25">SWITCH</tspan></text>
    <text x="400" y="654"><tspan x="400">CHARACTER</tspan><tspan x="400" dy="25">ACTING</tspan></text>
    <text x="247" y="602"><tspan x="247">BLOW</tspan><tspan x="247" dy="25">CANDLE</tspan></text>
    <text x="152" y="469"><tspan x="152">FILL WATER</tspan><tspan x="152" dy="25">CUP</tspan></text>
    <text x="152" y="308"><tspan x="152">ONE-WORD</tspan><tspan x="152" dy="25">STORY</tspan></text>
    <text x="247" y="177"><tspan x="247">DIYA</tspan><tspan x="247" dy="25">TOWER</tspan></text>
  </g>
  <circle cx="400" cy="400" r="121" fill="#21131c" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="400" cy="400" r="106" fill="url(#center)" stroke="#f1d08a" stroke-opacity=".52" stroke-width="2"/>
  <circle cx="400" cy="400" r="96" fill="none" stroke="#f8d987" stroke-opacity=".22" stroke-width="1"/>
  <g transform="translate(400 352)" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-51c-23 27-19 47 0 59 19-12 23-32 0-59Z" fill="#e9a953" stroke-width="3"/>
    <path d="M-50 13h100c-5 24-23 38-50 38s-45-14-50-38Z" fill="#8f4e3e" stroke-width="4"/>
    <path d="M-58 13h116" stroke-width="5"/>
  </g>
  <text x="400" y="431" fill="#fff0d3" font-family="Georgia,serif" font-size="29" font-weight="bold" text-anchor="middle">SPIN &amp;</text>
  <text x="400" y="467" fill="#f3cf82" font-family="Georgia,serif" font-size="29" font-weight="bold" text-anchor="middle">PLAY</text>
  <circle cx="400" cy="400" r="377" fill="none" stroke="#f6d991" stroke-opacity=".8" stroke-width="3"/>
