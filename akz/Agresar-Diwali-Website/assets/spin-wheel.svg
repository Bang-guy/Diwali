<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Diwali Spin and Play wheel</title>
  <desc id="description">Ten festive game wedges surrounding a golden diya.</desc>
  <defs>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#ffe7a4"/>
      <stop offset=".48" stop-color="#c99445"/>
      <stop offset="1" stop-color="#f8d987"/>
    </linearGradient>
    <radialGradient id="center" cx=".35" cy=".28">
      <stop stop-color="#71324e"/>
      <stop offset="1" stop-color="#32152e"/>
    </radialGradient>
    <linearGradient id="saffron" x2="0" y2="1">
      <stop stop-color="#f8a52e"/>
      <stop offset="1" stop-color="#e75b2d"/>
    </linearGradient>
    <linearGradient id="magenta" x2=".8" y2="1">
      <stop stop-color="#ed438c"/>
      <stop offset="1" stop-color="#a52676"/>
    </linearGradient>
    <linearGradient id="violet" x2="0" y2="1">
      <stop stop-color="#9a62e8"/>
      <stop offset="1" stop-color="#5935a7"/>
    </linearGradient>
    <linearGradient id="blue" x2=".8" y2="1">
      <stop stop-color="#39a4ec"/>
      <stop offset="1" stop-color="#2457bd"/>
    </linearGradient>
    <linearGradient id="teal" x2="0" y2="1">
      <stop stop-color="#31c5b0"/>
      <stop offset="1" stop-color="#087c80"/>
    </linearGradient>
    <linearGradient id="green" x2=".8" y2="1">
      <stop stop-color="#83bd49"/>
      <stop offset="1" stop-color="#318453"/>
    </linearGradient>
    <linearGradient id="coral" x2="0" y2="1">
      <stop stop-color="#ff7960"/>
      <stop offset="1" stop-color="#c83851"/>
    </linearGradient>
    <linearGradient id="golden" x2=".8" y2="1">
      <stop stop-color="#f4c84d"/>
      <stop offset="1" stop-color="#e77b30"/>
    </linearGradient>
    <linearGradient id="pink" x2="0" y2="1">
      <stop stop-color="#f36aaf"/>
      <stop offset="1" stop-color="#bd397f"/>
    </linearGradient>
    <linearGradient id="aqua" x2=".8" y2="1">
      <stop stop-color="#5bd0d0"/>
      <stop offset="1" stop-color="#2788aa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b0c14" flood-opacity=".55"/>
    </filter>
