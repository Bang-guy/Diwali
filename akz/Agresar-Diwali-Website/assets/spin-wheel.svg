  <circle cx="400" cy="400" r="392" fill="#26151f" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="400" cy="400" r="385" fill="none" stroke="#fff0c8" stroke-opacity=".72" stroke-width="2" stroke-dasharray="2 24" stroke-linecap="round"/>
  <g stroke="#f4d184" stroke-opacity=".65" stroke-width="2">
    <path d="M400 400 287.2 52.9A365 365 0 0 1 512.8 52.9Z" fill="url(#saffron)"/>
    <path d="M400 400 512.8 52.9A365 365 0 0 1 695.3 185.5Z" fill="url(#magenta)"/>
    <path d="M400 400 695.3 185.5A365 365 0 0 1 765 400Z" fill="url(#violet)"/>
    <path d="M400 400 765 400A365 365 0 0 1 695.3 614.5Z" fill="url(#blue)"/>
    <path d="M400 400 695.3 614.5A365 365 0 0 1 512.8 747.1Z" fill="url(#green)"/>
    <path d="M400 400 512.8 747.1A365 365 0 0 1 287.2 747.1Z" fill="url(#coral)"/>
    <path d="M400 400 287.2 747.1A365 365 0 0 1 104.7 614.5Z" fill="url(#pink)"/>
    <path d="M400 400 104.7 614.5A365 365 0 0 1 35 400Z" fill="url(#teal)"/>
